<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    (function () {
      var saved = localStorage.getItem("ocr-reader-theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="/static/icons/logo.svg" alt="" />
        <div class="brand-text">
          <span class="brand-title">{{ app_name }}</span>
          <span class="brand-subtitle">v{{ app_version }}</span>
        </div>
      </div>

      <ul class="nav-list">
        <li>
          <a class="nav-link {{ 'active' if active == 'upload' else '' }}" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2Z"/></svg>
            Upload
          </a>
        </li>
        <li>
          <a class="nav-link {{ 'active' if active == 'history' else '' }}" href="/history">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13a9 9 0 1 0 .5-4.5L3 8"/><path d="M12 7v5l4 2"/></svg>
            History
          </a>
        </li>
        <li>
          <a class="nav-link {{ 'active' if active == 'settings' else '' }}" href="/settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
            Settings
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span id="theme-toggle-label">Dark mode</span>
        </button>
        <div class="status-pill {{ 'ok' if openai_configured else 'warn' }}">
          <span class="status-dot"></span>
          {{ 'API key configured' if openai_configured else 'API key missing' }}
        </div>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="brand">
          <img class="brand-mark" src="/static/icons/logo.svg" alt="" style="width:24px;height:24px" />
          <span class="brand-title">{{ app_name }}</span>
        </div>
        <nav style="display:flex;gap:14px;align-items:center;">
          <a class="nav-link {{ 'active' if active == 'upload' else '' }}" href="/" style="padding:6px 8px;">Upload</a>
          <a class="nav-link {{ 'active' if active == 'history' else '' }}" href="/history" style="padding:6px 8px;">History</a>
          <a class="nav-link {{ 'active' if active == 'settings' else '' }}" href="/settings" style="padding:6px 8px;">Settings</a>
        </nav>
      </div>

      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
